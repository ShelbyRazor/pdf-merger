<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Merger - Diagnostic Mode</title>

  <!-- Changed to Cloudflare CDN (cdnjs) for maximum compatibility -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    .dropzone { border: 2px dashed #ccc; padding: 30px; text-align: center; margin-bottom: 20px; cursor: pointer; }
    #fileList { list-style: none; padding: 0; margin-bottom: 20px; }
    #fileList li { background: #eee; padding: 10px; margin-bottom: 5px; border-radius: 4px; display: flex; justify-content: space-between; }
    button { background: #0066cc; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; width: 100%; }
    button:disabled { background: #ccc; }
    #debugLog { margin-top: 20px; color: red; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Diagnostic PDF Merger</h2>
    
    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      Tap to select PDF files
    </div>
    <input type="file" id="fileInput" accept="application/pdf" multiple style="display: none;" />

    <ul id="fileList"></ul>
    <button id="mergeBtn" disabled>Merge & Download</button>
    <div id="debugLog"></div>
  </div>

  <script>
    let fileQueue = [];
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const mergeBtn = document.getElementById('mergeBtn');
    const debugLog = document.getElementById('debugLog');

    function logError(msg) {
      console.error(msg);
      debugLog.innerText += "\n[ERROR] " + msg;
      alert(msg); // Force it to show on mobile
    }

    fileInput.addEventListener('change', async (e) => {
      debugLog.innerText = ""; // Clear old logs
      const files = e.target.files;
      
      // 1. Check if library loaded via CDN
      if (typeof PDFLib === 'undefined') {
        logError("FATAL: PDFLib did not load from Cloudflare. Check your mobile browser's Adblocker or tracking protection.");
        return;
      }

      for (const file of files) {
        try {
          // 2. Read file to memory
          const buffer = await file.arrayBuffer();
          if (buffer.byteLength === 0) {
             throw new Error("File is empty (0 bytes). Android file picker failed to read it.");
          }

          // 3. Attempt to parse PDF
          const pdfDoc = await PDFLib.PDFDocument.load(buffer, { ignoreEncryption: true });
          const pages = pdfDoc.getPageCount();

          fileQueue.push({ file, buffer, pages });
        } catch (err) {
          logError(`Failed parsing "${file.name}"\nError Type: ${err.name}\nMessage: ${err.message}`);
        }
      }
      renderList();
    });

    function renderList() {
      fileList.innerHTML = '';
      fileQueue.forEach((item, index) => {
        const li = document.createElement('li');
        li.textContent = `${index + 1}. ${item.file.name} (${item.pages} pages)`;
        fileList.appendChild(li);
      });
      mergeBtn.disabled = fileQueue.length < 2;
    }

    mergeBtn.addEventListener('click', async () => {
      try {
        mergeBtn.disabled = true;
        const mergedPdf = await PDFLib.PDFDocument.create();
        for (const item of fileQueue) {
          const doc = await PDFLib.PDFDocument.load(item.buffer);
          const copiedPages = await mergedPdf.copyPages(doc, doc.getPageIndices());
          copiedPages.forEach(p => mergedPdf.addPage(p));
        }
        const mergedBytes = await mergedPdf.save();
        const blob = new Blob([mergedBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `merged_${Date.now()}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
      } catch (err) {
        logError(`Merge failed: ${err.message}`);
      } finally {
        mergeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
